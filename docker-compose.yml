# MongoDB per lo sviluppo locale: dati off-chain del backend (utenti, credenziali FIDO2, sessioni).
services:
  mongo:
    # Versione supportata (la 8.2 non riceve più correzioni di sicurezza dal 31 luglio 2026),
    # fissata con l'impronta: si scarica sempre esattamente questa immagine.
    # Nota: le versioni 8.x non partono sui kernel Linux da 6.19 a 7.0.13 (usare 7.0.14 o successivo).
    image: mongo:8.0.38@sha256:999744ea9784b56ca8a48cb47d697b78290c817feaf7ffb6946f44171b2d4055
    container_name: cartella-mongo
    restart: unless-stopped
    # Raggiungibile solo dal PC stesso, mai dalla rete esterna.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  mongo-data:
